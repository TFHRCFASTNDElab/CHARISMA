name: Save Traffic Data

on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly on Sunday at midnight
  workflow_dispatch:    # Adds a button to trigger it manually

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch traffic data
        uses: nsaunders/traffic-lite@v2.0.0
        with:
          path: .github/traffic.json
          repo: ${{ github.repository }}
          token: ${{ secrets.TRAFFIC_TOKEN }}

      - name: Commit data back to repository
        uses: EndBug/add-and-commit@v9
        with:
          add: '.github/traffic.json'
          message: 'chore: update repository traffic stats'
