name: Save Traffic Data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-traffic:
    runs-on: ubuntu-latest
    steps:
      # Update to v5 (or the newest available version) to clear checkout warnings
      - name: Checkout repository
        uses: actions/checkout@v5 

      - name: Fetch Traffic Data
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p .github/traffic
          
          # Fetch Views
          curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/views" > .github/traffic/views.json
            
          # Fetch Clones
          curl -s -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/traffic/clones" > .github/traffic/clones.json

      - name: Commit and Push Data
        run: |
          # Configure Git to commit as the GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .github/traffic/
          
          # Commit only if there are changes to avoid workflow failures
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: save traffic stats for views and clones"
            git push
          else
            echo "No new traffic data to commit."
          fi
